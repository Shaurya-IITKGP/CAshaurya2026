<VirtualHost *:80>
    ServerName ca.shauryaiitkgp.in

    # Frontend — serve built static files
    DocumentRoot /var/www/shaurya/frontend/dist

    <Directory /var/www/shaurya/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA fallback — rewrite all non-file requests to index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Proxy API requests to Node.js backend
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    # Cache static assets
    <LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|mp4|webm)$">
        Header set Cache-Control "public, max-age=2592000, immutable"
    </LocationMatch>

    # Deny access to dotfiles
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/shaurya-error.log
    CustomLog ${APACHE_LOG_DIR}/shaurya-access.log combined
</VirtualHost>

# --- HTTPS block (auto-created after running: sudo certbot --apache -d ca.shauryaiitkgp.in) ---
